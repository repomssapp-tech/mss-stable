name: Questionnaire dataset

# Fails when the officials' CSV/rules and the generated questionnaire.json
# copies drift apart, or when the dataset breaks a build rule (option counts
# across en/mr/hi, Devanagari in mr/hi questions, unresolved rule values).
on:
  pull_request:
    paths:
      - 'backend/catalog/msme_maharashtra_*'
      - 'backend/catalog/questionnaire.json'
      - 'backend/catalog/eligibility_rules.keyed.json'
      - 'backend/scripts/build_questionnaire.py'
      - 'backend/scripts/tests/**'
      - 'frontend/assets/data/questionnaire.json'
      - '.github/workflows/questionnaire.yml'
  push:
    branches: [main]
    paths:
      - 'backend/catalog/msme_maharashtra_*'
      - 'backend/scripts/build_questionnaire.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Outputs up to date
        run: python backend/scripts/build_questionnaire.py --check
      - name: Build-rule tests
        run: python -m pytest backend/scripts/tests -q
