name: Build App

# Finding 8.3 (audit_fix.md) — build/verify automation for the Flutter app
# component. Companion workflow: deploy-voice-agent.yml.
#
# Scope, per the audit: "at minimum flutter analyze + flutter test + release
# build artifact upload". This workflow does not publish to any store — it
# uploads an APK artifact. A verified, signed release from main is also
# published to the app's public GitHub update feed.
#
# ─── Rollout state: MANUAL FIRST ────────────────────────────────────────────
# workflow_dispatch-only. analyze + test run on every invocation; the release
# APK build runs on every invocation too, but is only marked promotable when
# dry_run=false AND signing secrets are present. Once this has produced one
# good signed build, it is safe to also run analyze+test on PRs by adding:
#
#   pull_request:
#     paths: ['frontend/**', '.github/workflows/build-app.yml']
#
# Keep the signed-build + artifact-upload path on workflow_dispatch until there
# is a real distribution target for it.
#
# ─── Required configuration (for a signed build) ────────────────────────────
# Repository → Settings → Environments → "production" (required reviewers).
# Environment secrets:
#   ANDROID_KEYSTORE_BASE64    — base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  — store password
#   ANDROID_KEY_ALIAS          — key alias (repo default: "upload")
#   ANDROID_KEY_PASSWORD       — key password
# Without these, the workflow still runs analyze/test and builds a debug-signed
# APK + web bundle so the pipeline is exercised end to end.
#
# Repository variables:
#   MSS_EDITION     — which MSS app this repository builds: central (default,
#                     com.inschemes.app), tn (com.inschemes.app.tn) or mh
#                     (com.inschemes.app.mh). See frontend/lib/config/edition.dart.
#   RELEASES_REPO   — public repository the signed APKs are published to. It
#                     must match the edition's releasesRepo in edition.dart
#                     (default nyxri0f8/MSS_App-releases, the Central edition).
#   FLUTTER_VERSION — exact Flutter version to pin. Leave unset to track the
#   latest stable channel. pubspec.yaml requires Dart >= 3.11.1, so a pinned
#   value must be a Flutter release that bundles at least that Dart SDK.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify + build, but do not treat the output as a promotable release."
        type: boolean
        default: true
      channel:
        description: >-
          prod = the real app (com.inschemes.app; publishes from main as a user
          update). dev = the separate test app (com.inschemes.app.dev, "MSS
          Dev", GPS location lock on), published as a pre-release the in-app
          updater never offers.
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  # analyze + test, the APK and the web bundle run as three parallel jobs
  # (they used to run one after another: ~10 min of tests, then ~13 min of
  # APK). The final "promotable" job needs all three, so a release is still
  # only promotable when analyze and test pass.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION || '3.47.5' }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.dry_run == 'false' && 'production' || '' }}
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
      dev_tag: ${{ steps.dev_draft.outputs.tag }}
    env:
      # Read by android/app/build.gradle.kts: the dev build gets its own
      # applicationId and name.
      MSS_CHANNEL: ${{ github.event.inputs.channel || 'prod' }}
      # Which MSS app: central | tn | mh (own app ID, name, state, languages).
      MSS_EDITION: ${{ vars.MSS_EDITION || 'central' }}
    steps:
      - uses: actions/checkout@v4

      # The runner image is nearly full once Flutter, the Android SDK and
      # ~/.gradle are in place: saving the Gradle cache failed with "tar:
      # Wrote only 8192 of 10240 bytes", so every build re-downloaded every
      # Android dependency. Drop toolchains this job never uses (~10 GB).
      - name: Free disk space
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup             /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h / | tail -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # matches android/app/build.gradle.kts JavaVersion.VERSION_17

      # Caches ~/.gradle (dependencies, wrapper, and the build cache that
      # org.gradle.caching=true fills) for the gradlew run flutter starts.
      # Written from main only; other branches read main's cache.
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION || '3.47.5' }}
          cache: true

      - name: Flutter / Dart versions
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # A phone updates an installed app in place only if the new build has the
      # same applicationId, the same signing key and a HIGHER versionCode (the
      # number after "+" in pubspec.yaml). This step fails a build whose
      # versionCode went down, and, for a promotable release, one that did not
      # go up past the last release tag (app-v<version>+<build>).
      # See docs/APP_VERSIONING.md.
      - name: Version check (builds must install as updates)
        id: version
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main || true
          if git rev-parse --verify -q origin/main >/dev/null; then
            dart run tool/app_version.dart check --against origin/main
          else
            dart run tool/app_version.dart check
          fi
          # The dev app has its own applicationId: it need not climb past the
          # production release tags.
          if [ "${{ github.event.inputs.dry_run }}" = "false" ] && [ "$MSS_CHANNEL" != "dev" ]; then
            git fetch --tags --depth=1 origin || true
            dart run tool/app_version.dart check --against-latest-tag app-v --require-increase
          fi
          echo "name=$(dart run tool/app_version.dart show | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Materialise dart_defines.json
        id: dart_defines
        env:
          # Optional: point a build at another backend. Defaults to production.
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          lock=false
          if [ "$MSS_CHANNEL" = "dev" ]; then lock=true; fi
          jq -n --arg url "${API_BASE_URL:-https://mssapi.msmeschemes.org}" \
            --arg channel "$MSS_CHANNEL" --arg lock "$lock" --arg edition "$MSS_EDITION" \
            '{API_BASE_URL: $url, MSS_CHANNEL: $channel, MSS_LOCATION_LOCK: $lock, MSS_EDITION: $edition}' > dart_defines.json
          echo "present=true" >> "$GITHUB_OUTPUT"

      # The Google services plugin needs a client entry for the build's
      # applicationId (dev build, Tamil Nadu or Maharashtra edition). Same
      # Firebase project: push notifications may not reach such an app until
      # its app ID is registered there.
      - name: Firebase config for the dev app and state editions
        if: ${{ env.MSS_CHANNEL == 'dev' || env.MSS_EDITION != 'central' }}
        run: |
          set -euo pipefail
          pkg="com.inschemes.app"
          if [ "$MSS_EDITION" != "central" ]; then pkg="$pkg.$MSS_EDITION"; fi
          if [ "$MSS_CHANNEL" = "dev" ]; then pkg="$pkg.dev"; fi
          echo "Android app ID: $pkg"
          f=android/app/google-services.json
          jq --arg pkg "$pkg" '.client += [.client[0] | .client_info.android_client_info.package_name = $pkg]' "$f" > "$f.tmp"
          mv "$f.tmp" "$f"

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "No signing secrets present — will build a debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: ${{ steps.dart_defines.outputs.present == 'true' && steps.signing.outputs.signed == 'true' }}
        # Obfuscated Dart (test report SEC-07); the symbol files needed to
        # read crash stack traces are uploaded as their own artifact below.
        run: >-
          flutter build apk --release
          --obfuscate --split-debug-info=build/debug-symbols
          --dart-define-from-file=dart_defines.json

      - name: Build debug APK (no signing secrets)
        if: ${{ steps.dart_defines.outputs.present == 'true' && steps.signing.outputs.signed != 'true' }}
        run: flutter build apk --debug --dart-define-from-file=dart_defines.json

      - name: Remove build secrets
        if: ${{ always() }}
        run: rm -f android/key.properties android/app/upload-keystore.jks dart_defines.json

      # The dev (test) app: verified, then uploaded to the public releases
      # repo as a DRAFT pre-release. Drafts are invisible to users; the
      # publish-dev job makes it a visible pre-release once tests pass. The
      # in-app updater ignores pre-releases and any tag that is not
      # app-v<version>+<build>, so no production phone is ever offered it.
      - name: Stage the dev build as a draft pre-release
        id: dev_draft
        if: ${{ env.MSS_CHANNEL == 'dev' && github.event.inputs.dry_run == 'false' && steps.signing.outputs.signed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'nyxri0f8/MSS_App-releases' }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASES_REPO_TOKEN is not set: cannot publish the dev build."
            exit 1
          fi
          name="${VERSION%%+*}"
          build="${VERSION##*+}"
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -x "$build_tools/apksigner" ] || [ ! -x "$build_tools/aapt2" ]; then
            sdkmanager 'build-tools;36.0.0'
          fi
          signature="$("$build_tools/apksigner" verify --print-certs "$source_apk")"
          signer="$(printf '%s\n' "$signature" | awk -F ': ' '/^Signer #[0-9]+ certificate SHA-256 digest:/ { print tolower($2) }')"
          if [ "$signer" != 'cc58f15af1edd4a4d2aa8d3109953fcfc1acf57843d195e0a7ec04a5de847af1' ]; then
            echo "::error::APK signer does not match the expected release certificate."
            exit 1
          fi
          "$build_tools/aapt2" dump badging "$source_apk" |
            grep -F "package: name='com.inschemes.app.dev' versionCode='$build' versionName='$name'"
          tag="dev-v${VERSION}-run${GITHUB_RUN_NUMBER}"
          apk="mss-dev-${name}-build${build}-run${GITHUB_RUN_NUMBER}.apk"
          cp "$source_apk" "$apk"
          {
            echo "TEST BUILD - not for production use. Do not share with users."
            echo
            echo "Installs as a separate app (\"MSS Dev\", com.inschemes.app.dev) next to the real MSS app and never replaces or updates it. The real app is never offered this build."
            echo
            awk -v head="## [${VERSION}]" '
              index($0, head) == 1 { f = 1; next }
              /^## \[/ { f = 0 }
              f
            ' ../CHANGELOG.md
            echo
            echo "Built by GitHub Actions run ${GITHUB_RUN_ID} from ${GITHUB_SHA::7} (${GITHUB_REF_NAME})."
          } > dev_notes.md
          gh release create "$tag" "$apk" \
            --repo "$RELEASES_REPO" \
            --title "MSS Dev ${name} (test build ${build}, run ${GITHUB_RUN_NUMBER})" \
            --notes-file dev_notes.md \
            --draft --prerelease
          rm -f dev_notes.md "$apk"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Dev builds go to a draft release instead (see "Stage the dev build"),
      # so they do not need the account's artifact storage.
      - name: Upload APK
        if: ${{ steps.dart_defines.outputs.present == 'true' && env.MSS_CHANNEL != 'dev' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: frontend/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Dart debug symbols
        if: ${{ steps.dart_defines.outputs.present == 'true' && steps.signing.outputs.signed == 'true' }}
        continue-on-error: ${{ env.MSS_CHANNEL == 'dev' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-symbols-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: frontend/build/debug-symbols
          if-no-files-found: error
          retention-days: 90


  web:
    # The dev build is Android only (and must not need artifact storage).
    if: ${{ github.event.inputs.channel != 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION || '3.47.5' }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Materialise dart_defines.json
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          jq -n --arg url "${API_BASE_URL:-https://mssapi.msmeschemes.org}"             '{API_BASE_URL: $url}' > dart_defines.json

      - name: Build web bundle
        run: flutter build web --release --dart-define-from-file=dart_defines.json

      - name: Remove build config
        if: ${{ always() }}
        run: rm -f dart_defines.json

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-web-${{ github.sha }}
          path: frontend/build/web
          if-no-files-found: error
          retention-days: 14

  promotable:
    needs: [verify, build, web]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.dry_run == 'false' && needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main' && github.event.inputs.channel != 'dev' && 'production' || '' }}
    # Publication uses the repository changelog and the verified build artifact.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Promotable?
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "false" ] && [ "${{ needs.build.outputs.signed }}" = "true" ]; then
            echo "Signed release build — artifact app-apk-${{ needs.build.outputs.version }}-${{ github.sha }} is promotable."
          else
            echo "Not promotable: dry_run=${{ github.event.inputs.dry_run }}, signed=${{ needs.build.outputs.signed }}."
          fi

      - uses: actions/checkout@v4
        if: ${{ github.event.inputs.dry_run == 'false' && needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main' && github.event.inputs.channel != 'dev' }}

      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.dry_run == 'false' && needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main' && github.event.inputs.channel != 'dev' }}
        with:
          name: app-apk-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: release-apk

      - uses: actions/setup-java@v4
        if: ${{ github.event.inputs.dry_run == 'false' && needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main' && github.event.inputs.channel != 'dev' }}
        with:
          distribution: temurin
          java-version: "21"

      # Every verified signed main build becomes an update: a release in the PUBLIC
      # releases-only repo (this repo is private, so its own releases 404 for
      # users). The app's update check reads that repo's releases and shows
      # the version and these notes (the CHANGELOG entry). Needs the
      # RELEASES_REPO_TOKEN secret: a fine-grained token with Contents
      # read/write on that one repo. Without it the step says so and skips.
      - name: Publish the update to the public releases repo
        if: ${{ github.event.inputs.dry_run == 'false' && needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main' && github.event.inputs.channel != 'dev' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'nyxri0f8/MSS_App-releases' }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          name="${VERSION%%+*}"
          build="${VERSION##*+}"
          short="${name%.0}"
          source_apk="release-apk/app-release.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -x "$build_tools/apksigner" ] || [ ! -x "$build_tools/aapt2" ]; then
            sdkmanager 'build-tools;36.0.0'
          fi
          if ! signature="$("$build_tools/apksigner" verify --print-certs "$source_apk")"; then
            echo "$signature"
            echo "::error::APK signature verification failed."
            exit 1
          fi
          signer="$(printf '%s\n' "$signature" | awk -F ': ' '/^Signer #[0-9]+ certificate SHA-256 digest:/ { print tolower($2) }')"
          if [ "$signer" != 'cc58f15af1edd4a4d2aa8d3109953fcfc1acf57843d195e0a7ec04a5de847af1' ]; then
            echo "::error::APK signer does not match the expected release certificate."
            exit 1
          fi
          echo "Verified the release certificate."
          "$build_tools/aapt2" dump badging "$source_apk" |
            grep -F "package: name='com.inschemes.app' versionCode='$build' versionName='$name'"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASES_REPO_TOKEN is not set: not publishing the update."
            exit 0
          fi
          apk="release-apk/mss-app-${name}-build${build}.apk"
          cp "$source_apk" "$apk"
          # The CHANGELOG entry for this version, between its heading and the next.
          awk -v head="## [${VERSION}]" '
            index($0, head) == 1 { f = 1; next }
            /^## \[/ { f = 0 }
            f
          ' CHANGELOG.md > notes_body.md
          if [ ! -s notes_body.md ]; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}."
            exit 1
          fi
          {
            echo "MSS app v${short} (build ${build}). Installs as an update and keeps your data."
            echo
            cat notes_body.md
            echo
            echo "Built by GitHub Actions run ${GITHUB_RUN_ID} from ${GITHUB_SHA::7}."
          } > notes.md
          gh release create "app-v${VERSION}" "$apk" \
            --repo "$RELEASES_REPO" \
            --title "MSS app v${short}" \
            --notes-file notes.md
          rm -f notes.md notes_body.md

  # Dev channel: the staged draft becomes a visible pre-release only after
  # analyze + test passed. A failed run leaves an invisible draft behind.
  publish-dev:
    needs: [verify, build]
    if: ${{ github.event.inputs.channel == 'dev' && github.event.inputs.dry_run == 'false' && needs.build.outputs.dev_tag != '' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: .
    steps:
      - name: Publish the dev pre-release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'nyxri0f8/MSS_App-releases' }}
          TAG: ${{ needs.build.outputs.dev_tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false --prerelease --latest=false
          gh release view "$TAG" --repo "$RELEASES_REPO" --json url,isPrerelease,isDraft
