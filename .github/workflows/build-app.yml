name: Build App

# Finding 8.3 (audit_fix.md) — build/verify automation for the Flutter app
# component. Companion workflow: deploy-voice-agent.yml.
#
# Scope, per the audit: "at minimum flutter analyze + flutter test + release
# build artifact upload". This workflow does not publish to any store — it
# produces a signed (or, without signing secrets, an unsigned) build artifact
# for a human to promote.
#
# ─── Rollout state: MANUAL FIRST ────────────────────────────────────────────
# workflow_dispatch-only. analyze + test run on every invocation; the release
# APK build runs on every invocation too, but is only marked promotable when
# dry_run=false AND signing secrets are present. Once this has produced one
# good signed build, it is safe to also run analyze+test on PRs by adding:
#
#   pull_request:
#     paths: ['frontend/**', '.github/workflows/build-app.yml']
#
# Keep the signed-build + artifact-upload path on workflow_dispatch until there
# is a real distribution target for it.
#
# ─── Required configuration (for a signed build) ────────────────────────────
# Repository → Settings → Environments → "production" (required reviewers).
# Environment secrets:
#   ANDROID_KEYSTORE_BASE64    — base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  — store password
#   ANDROID_KEY_ALIAS          — key alias (repo default: "upload")
#   ANDROID_KEY_PASSWORD       — key password
# Without these, the workflow still runs analyze/test and builds a debug-signed
# APK + web bundle so the pipeline is exercised end to end.
#
# Repository variable (optional):
#   FLUTTER_VERSION — exact Flutter version to pin. Leave unset to track the
#   latest stable channel. pubspec.yaml requires Dart >= 3.11.1, so a pinned
#   value must be a Flutter release that bundles at least that Dart SDK.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify + build, but do not treat the output as a promotable release."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  # analyze + test, the APK and the web bundle run as three parallel jobs
  # (they used to run one after another: ~10 min of tests, then ~13 min of
  # APK). The final "promotable" job needs all three, so a release is still
  # only promotable when analyze and test pass.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.dry_run == 'false' && 'production' || '' }}
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      # Caches ~/.gradle (dependencies, wrapper, and the build cache that
      # org.gradle.caching=true fills), keyed on the Gradle files, so the APK
      # build no longer downloads every Android dependency on each run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # matches android/app/build.gradle.kts JavaVersion.VERSION_17
          cache: gradle
          cache-dependency-path: |
            frontend/android/*.gradle*
            frontend/android/app/*.gradle*
            frontend/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true

      - name: Flutter / Dart versions
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # A phone updates an installed app in place only if the new build has the
      # same applicationId, the same signing key and a HIGHER versionCode (the
      # number after "+" in pubspec.yaml). This step fails a build whose
      # versionCode went down, and, for a promotable release, one that did not
      # go up past the last release tag (app-v<version>+<build>).
      # See docs/APP_VERSIONING.md.
      - name: Version check (builds must install as updates)
        id: version
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main || true
          if git rev-parse --verify -q origin/main >/dev/null; then
            dart run tool/app_version.dart check --against origin/main
          else
            dart run tool/app_version.dart check
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            git fetch --tags --depth=1 origin || true
            dart run tool/app_version.dart check --against-latest-tag app-v --require-increase
          fi
          echo "name=$(dart run tool/app_version.dart show | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Materialise dart_defines.json
        id: dart_defines
        env:
          # Optional: point a build at another backend. Defaults to production.
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          jq -n --arg url "${API_BASE_URL:-https://mssapi.msmeschemes.org}" \
            '{API_BASE_URL: $url}' > dart_defines.json
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "No signing secrets present — will build a debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: ${{ steps.dart_defines.outputs.present == 'true' && steps.signing.outputs.signed == 'true' }}
        # Obfuscated Dart (test report SEC-07); the symbol files needed to
        # read crash stack traces are uploaded as their own artifact below.
        run: >-
          flutter build apk --release
          --obfuscate --split-debug-info=build/debug-symbols
          --dart-define-from-file=dart_defines.json

      - name: Build debug APK (no signing secrets)
        if: ${{ steps.dart_defines.outputs.present == 'true' && steps.signing.outputs.signed != 'true' }}
        run: flutter build apk --debug --dart-define-from-file=dart_defines.json

      - name: Remove build secrets
        if: ${{ always() }}
        run: rm -f android/key.properties android/app/upload-keystore.jks dart_defines.json

      - name: Upload APK
        if: ${{ steps.dart_defines.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: frontend/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Dart debug symbols
        if: ${{ steps.dart_defines.outputs.present == 'true' && steps.signing.outputs.signed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-symbols-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: frontend/build/debug-symbols
          if-no-files-found: error
          retention-days: 90


  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Materialise dart_defines.json
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          jq -n --arg url "${API_BASE_URL:-https://mssapi.msmeschemes.org}"             '{API_BASE_URL: $url}' > dart_defines.json

      - name: Build web bundle
        run: flutter build web --release --dart-define-from-file=dart_defines.json

      - name: Remove build config
        if: ${{ always() }}
        run: rm -f dart_defines.json

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-web-${{ github.sha }}
          path: frontend/build/web
          if-no-files-found: error
          retention-days: 14

  promotable:
    needs: [verify, build, web]
    runs-on: ubuntu-latest
    # No checkout here, so the workflow default (frontend/) does not exist.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Promotable?
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "false" ] && [ "${{ needs.build.outputs.signed }}" = "true" ]; then
            echo "Signed release build — artifact app-apk-${{ needs.build.outputs.version }}-${{ github.sha }} is promotable."
          else
            echo "Not promotable: dry_run=${{ github.event.inputs.dry_run }}, signed=${{ needs.build.outputs.signed }}."
          fi
