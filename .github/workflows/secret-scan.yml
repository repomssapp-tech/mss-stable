name: Secret Scan

# Blocks commits that contain credentials (API keys, JWTs, service-role keys,
# private keys). Added after a Supabase service_role key was found in git
# history (issue #126). Scans only the commits in the push / PR, so the old
# commit on feat/admin-panel-sync does not fail every run; rotate that key.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action lists the PR's commits to scan only those.
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The SARIF report upload failed the job once the account's Actions
          # artifact storage quota was full, even with no leaks found. The
          # findings are still printed in the job log.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
