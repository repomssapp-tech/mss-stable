name: RLS Drift Check

# M8 -- enforces RLS posture against the LIVE project on a schedule, because
# dashboard / manual SQL edits never pass through `supabase db reset` and so
# are invisible to the backend-database.yml job.
#
# Requires one repository secret:
#   SUPABASE_DB_URL  -- a Postgres connection string for the hosted project
#                       using a role that may EXECUTE
#                       private.rls_coverage_violations() (the `postgres`
#                       superuser string from Project Settings -> Database,
#                       or a dedicated role granted service_role).
#                       Prefer the session/pooler URI on port 5432.

on:
  schedule:
    # Mondays 04:30 UTC (10:00 IST) -- just after the link health check.
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rls-drift-check
  cancel-in-progress: false

jobs:
  rls-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Query live RLS coverage
        id: check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning::SUPABASE_DB_URL secret not set -- skipping live RLS drift check"
            echo "### RLS Drift Check skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the \`SUPABASE_DB_URL\` repository secret to enable it." >> "$GITHUB_STEP_SUMMARY"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 \
            -c "select scope || ' :: ' || object || ' -- ' || issue
                  from private.rls_coverage_violations()
                 order by scope, object;" \
            | sed '/^$/d' > drift.txt
          count=$(wc -l < drift.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "----- rls_coverage_violations() -----"
          cat drift.txt || true
          if [ "$count" != "0" ]; then
            echo "::error::$count RLS posture violation(s) on the live project"
          fi

      - name: Open / update tracking issue
        if: steps.check.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift.txt', 'utf8').trim();
            const marker = '<!-- rls-drift-check -->';
            const body = [
              marker,
              `\`private.rls_coverage_violations()\` returned findings on **${new Date().toISOString()}**:`,
              '',
              '```',
              report,
              '```',
              '',
              'Fix the drift on the live project (a policy/GRANT reverted, RLS toggled off, or FORCE missing), '
              + 'then re-run this workflow to close.',
            ].join('\n');
            const { owner, repo } = context.repo;

            // Self-provision the label so issues.create never 422s.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'rls-drift' });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner, repo, name: 'rls-drift', color: 'B60205',
                description: 'Live RLS posture drift detected by rls-drift-check',
              });
            }

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'rls-drift', per_page: 20,
            });
            const hit = existing.data.find(i => (i.body || '').includes(marker));
            if (hit) {
              await github.rest.issues.createComment({ owner, repo, issue_number: hit.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'RLS drift detected on the live project',
                body, labels: ['rls-drift'],
              });
            }

      - name: Fail if drift found
        if: steps.check.outputs.count != '0'
        run: exit 1
