name: Deploy Edge Functions

# Finding 8.3 (audit_fix.md) — deployment automation for the Supabase Edge
# Functions component. Companion workflows: deploy-voice-agent.yml, build-app.yml.
#
# ─── Rollout state: MANUAL / DRY-RUN FIRST ────────────────────────────────────
# This workflow is workflow_dispatch-only on purpose. Do NOT add push triggers
# until it has completed one real (dry_run=false) deploy successfully and the
# GET /v1/health probe (finding 8.1) has been confirmed to report the new
# revision healthy. The promotion path, once that is done, is to add:
#
#   push:
#     branches: [main]
#     paths: ['backend/supabase/functions/**', '.github/workflows/deploy-edge-functions.yml']
#
# ─── Required configuration ──────────────────────────────────────────────────
# Repository → Settings → Environments → "production" (add required reviewers
# there — that is what enforces human approval; this file only names the gate).
#
# Environment secrets:
#   SUPABASE_ACCESS_TOKEN  — a personal access token (Account → Access Tokens)
#                            or a CI token scoped to this project.
# Environment variables (Settings → Variables), or edit the defaults below:
#   SUPABASE_PROJECT_REF       — target project ref. Defaults to houpzsxmwemoztpuigmo
#                                (already the value used throughout backend/).
#   SUPABASE_PUBLISHABLE_KEY   — client-visible publishable key, needed only for
#                                the post-deploy health probe because
#                                [functions.v1] verify_jwt = true rejects an
#                                unauthenticated request at the gateway. Defaults
#                                to the same value baked into frontend/lib/main.dart.
#
# Function secrets (SARVAM_API_KEY, LIVEKIT_* …) are NOT managed here — they are
# set once with `supabase secrets set --project-ref …` and left alone. This
# workflow only ships function code.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and type-check only — do not deploy to the live project."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-dry-run touches the live project, so it goes through the reviewed
    # environment. Dry-run stays outside it so anyone can smoke-test the bundle.
    environment: ${{ github.event.inputs.dry_run == 'false' && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend tooling (pinned supabase CLI)
        run: npm ci
        working-directory: backend

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"

      - name: Show pinned CLI version
        run: npx supabase --version
        working-directory: backend

      # Gate the deploy on the edge-function test suite (finding D12) so a red
      # suite can never ship.
      - name: Edge-function tests
        run: npm run functions:test
        working-directory: backend

      - name: Type-check every function entrypoint
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ "$name" = "_shared" ] && continue
            entry="${dir}index.ts"
            [ -f "$entry" ] || { echo "::warning::$name has no index.ts, skipping"; continue; }
            echo "deno check $entry"
            # --node-modules-dir=auto mirrors the functions:test script so npm:
            # specifiers (e.g. db-change-notify's @supabase/supabase-js) resolve.
            deno check --node-modules-dir=auto "$entry"
          done
        working-directory: backend

      - name: List functions that would be deployed
        run: |
          set -euo pipefail
          echo "Functions in backend/supabase/functions:"
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ "$name" = "_shared" ] && continue
            echo "  - $name"
          done
        working-directory: backend

      - name: Deploy to Supabase
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'houpzsxmwemoztpuigmo' }}
        run: |
          set -euo pipefail
          npx supabase functions deploy --project-ref "$PROJECT_REF"
        working-directory: backend

      - name: Post-deploy health probe
        if: ${{ github.event.inputs.dry_run == 'false' }}
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'houpzsxmwemoztpuigmo' }}
          # [functions.v1] verify_jwt = true — the gateway 401s an unauthenticated
          # call, so the probe must present the publishable key exactly as the
          # Flutter client does (apikey + Authorization).
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_GnJpz6ZxuGeeroG92VkbBA_b3_pyTvN' }}
        run: |
          set -euo pipefail
          url="https://${PROJECT_REF}.supabase.co/functions/v1/v1/health"
          echo "Probing $url"
          for attempt in 1 2 3 4 5; do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' \
              -H "apikey: ${PUBLISHABLE_KEY}" \
              -H "Authorization: Bearer ${PUBLISHABLE_KEY}" \
              "$url" || true)"
            echo "attempt $attempt → HTTP $code"
            cat /tmp/health.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              # The finding-8.1 health check returns 503 on real failure, but
              # guard against a degraded-but-200 body just in case.
              if grep -q '"fail"' /tmp/health.json; then
                echo "::error::/v1/health returned 200 but a component reported 'fail'."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::error::/v1/health did not return 200 after deploy — investigate before considering this release good."
          exit 1

      - name: Dry-run summary
        if: ${{ github.event.inputs.dry_run != 'false' }}
        run: echo "Dry run only — tests + type-check passed, nothing deployed. Re-run with dry_run=false to ship."
