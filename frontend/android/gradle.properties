# JVM sized for a ~16 GB dev machine so the Gradle daemon isn't OOM-killed
# (which forced a cold rebuild every run). Raise -Xmx if you have 32 GB+.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Build-speed flags (were unset). Nothing is removed from the build.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
