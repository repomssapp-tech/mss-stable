name: frontend
description: "MSS - MSME Schemes Search Flutter Application"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.0+7

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.18.0
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  speech_to_text: ^7.4.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  confetti: ^0.8.0
  http: ^1.5.0
  crypto: ^3.0.7
  connectivity_plus: ^7.3.1
  livekit_client: ^2.8.0
  archive: ^3.6.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  package_info_plus: 9.0.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on an emulator (integration_test/).
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # google_fonts resolves GoogleFonts.inter() to Inter-<Weight>.ttf here
    # (runtime fetching is off); same variable font as assets/fonts.
    - assets/google_fonts/
    - assets/images/Logo/Logo.webp
    - assets/images/Logo/Logo icon.webp
    - assets/images/Logo/compoanion bot.webp
    - assets/images/Logo/TN Chapter_20260805_153104_0000.webp
    - assets/images/Logo/TN Chapter_20260805_153307_0000.webp
    - assets/images/Logo/rit_logo.webp
    - assets/images/Logo/rit_logo_white.png
    - assets/images/Logo/sss_tn_chapter_logo.webp
    - assets/images/Background/splash_screen.webp
    - assets/images/Background/search_banner.webp
    - assets/images/Background/mode selection bg.webp
    - assets/images/Background/companion intro bg.webp
    - assets/images/Background/profile process banner.webp
    - assets/images/Background/suggestion banner.webp
    - assets/images/Background/new scheme banner.webp
    - assets/images/Background/alert banner.webp
    - assets/images/Background/notification banner.webp
    - assets/images/Background/tip banner.webp
    - assets/images/Background/Home_screen_bg.webp
    - assets/images/Background/Login_bg.webp
    - assets/images/Background/onboarding_bg.webp
    - assets/images/States assets/Indian emblem.webp
    - assets/images/States assets/States/
    - assets/images/States assets/State Emblem/
    - assets/images/saarthi/sarathi.webp
    - assets/images/supporting assets/support_agent.webp
    - assets/images/supporting assets/user_avatar.webp
    - assets/catalog/
    - assets/search/




  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Bundled per spec_design_system.md §0: Inter and Noto Sans Tamil ship as
  # variable fonts upstream (google/fonts no longer has static per-weight
  # TTFs for them), so the same file is registered under each weight we use
  # and Skia renders the matching variable-font instance. Poppins is static
  # upstream; only the two weights actually used (600, 700) are bundled.
  # OFL.txt license files live alongside the TTFs in assets/fonts/.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTamil-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTamil-Variable.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTamil-Variable.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
          weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  #  


